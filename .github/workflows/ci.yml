name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build

  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # generate_context! embeds ../dist at compile time, so the frontend
      # bundle must exist before any cargo step runs.
      - run: npm ci
      - run: npm run build
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # llama.cpp needs cmake + a C/C++ toolchain (preinstalled on GH runners).
      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Format check
        working-directory: src-tauri
        run: cargo fmt --all -- --check
      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        working-directory: src-tauri
        run: cargo test

  # Headless boot smoke (BN-12): launch the real app and require the webview
  # to report a successful boot within 120s (the in-app watchdog fails first).
  # Uses a release build because debug binaries serve devUrl instead of the
  # embedded bundle. Windows runners provide an interactive session, so the
  # WebView2 window can be created without extra display plumbing.
  boot-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Build release binary
        working-directory: src-tauri
        # custom-protocol embeds ../dist; without it even release binaries
        # serve devUrl (localhost:1420) and the smoke fails with
        # ERR_CONNECTION_REFUSED.
        run: cargo build --release --features custom-protocol
      - name: Boot smoke
        working-directory: src-tauri
        shell: pwsh
        run: |
          $env:AI_EDITOR_SMOKE = "1"
          $p = Start-Process -FilePath ".\target\release\ai-editor.exe" -PassThru `
            -RedirectStandardOutput smoke-out.txt -RedirectStandardError smoke-err.txt
          if (-not $p.WaitForExit(180000)) {
            $p.Kill()
            Get-Content smoke-out.txt, smoke-err.txt | Write-Host
            Write-Host "::error::boot smoke timed out after 180s"
            exit 1
          }
          Write-Host "SMOKE_EXIT=$($p.ExitCode)"
          Get-Content smoke-out.txt, smoke-err.txt | Write-Host
          if ($p.ExitCode -ne 0) { exit 1 }
          if (-not (Select-String -Path smoke-out.txt -Pattern "AI_EDITOR_SMOKE_OK" -Quiet)) {
            Write-Host "::error::AI_EDITOR_SMOKE_OK not reported"
            exit 1
          }
